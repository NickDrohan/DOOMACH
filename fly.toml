# The browser runtime, WebSocket/HTTP co-op relay, and bot league page on Fly.io.
# All persistent player state (characters, preferences, save slots) lives in the
# browser (cookies + localStorage), so no persistent volume or dedicated IPv4 is needed.
app = "doomach"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# the browser WebSocket endpoint (wss://doomach.fly.dev:5029/ws)
[[services]]
  protocol = "tcp"
  internal_port = 5030
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5029
    handlers = ["tls", "http"]

# the browser app and league pages, served by hedge; Fly ends TLS
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
