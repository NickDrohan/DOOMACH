<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DOOMACH</title>
<meta name="description" content="Doom in Mach 7.0 (wasi-wasm32) — full-screen 4:3 browser runtime with online lockstep co-op, deathmatch, and neural-network bot leagues.">
<style>
  :root {
    --accent: #d8362c;
    --accent-bright: #ff5247;
    --hud-bg: rgba(14, 12, 11, 0.82);
    --hud-border: rgba(255, 255, 255, 0.16);
    --hud-fg: #f0ebe3;
    --hud-muted: #a99f94;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    color: var(--hud-fg);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Maximal 4:3 fit inside the viewport:
     - Landscape / desktop: full height (100dvh), width clamped to 4:3
     - Portrait / mobile:   full width (100vw), height clamped to 4:3 */
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    aspect-ratio: 4 / 3;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.9);
  }
  #screen {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    cursor: crosshair;
  }
  #loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at center, rgba(28, 14, 12, 0.88), rgba(0, 0, 0, 0.96));
    padding: 24px;
    text-align: center;
    z-index: 20;
    transition: opacity 0.25s ease;
  }
  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loader-title {
    font: 800 2rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: 0.12em;
    color: var(--accent-bright);
    text-shadow: 0 2px 16px rgba(216, 54, 44, 0.55);
  }
  .loader-sub {
    color: var(--hud-muted);
    font-size: 0.9rem;
    max-width: 380px;
  }
  .bar-track {
    width: min(280px, 75%);
    height: 6px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 25%;
    background: var(--accent-bright);
    transition: width 0.2s ease;
  }
  .retry-btn {
    display: none;
    appearance: none;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    font: 600 0.95rem/1.2 inherit;
    cursor: pointer;
  }
  .pill {
    appearance: none;
    border: 1px solid var(--hud-border);
    background: var(--hud-bg);
    color: var(--hud-fg);
    border-radius: 6px;
    padding: 6px 12px;
    font: 600 0.82rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .pill:hover {
    border-color: var(--accent-bright);
    color: #fff;
  }
  .pill.accent {
    background: rgba(179, 32, 26, 0.88);
    border-color: rgba(255, 110, 95, 0.45);
    color: #fff;
  }

  /* Room code join modal */
  #joinModal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 50;
    padding: 16px;
  }
  #joinModal.open {
    display: flex;
  }
  .modal-card {
    background: #181412;
    border: 1px solid var(--hud-border);
    border-radius: 10px;
    padding: 18px 20px;
    width: min(320px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
  }
  .modal-title {
    font-weight: 700;
    font-size: 1rem;
  }
  .modal-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--hud-border);
    background: #0d0b0a;
    color: #fff;
    font: 700 1.25rem/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    text-align: center;
    outline: none;
  }
  .modal-input:focus {
    border-color: var(--accent-bright);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }


</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
    <div id="loader">
      <div class="loader-title">DOOMACH</div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="loader-sub" id="loadStatus">Initializing Mach 7.0 WebAssembly runtime...</div>
      <button class="retry-btn" id="retryBtn" type="button">Launch</button>
    </div>
  </div>



  <div id="joinModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title">Join Room Code</div>
      <input class="modal-input" id="roomInput" type="text" maxlength="6" placeholder="KQ7M2T" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="pill" type="button" id="joinCancelBtn">Cancel</button>
        <button class="pill accent" type="button" id="joinGoBtn">Join Game</button>
      </div>
    </div>
  </div>

  <div id="nameModal" role="dialog" aria-modal="true" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.72);z-index:50;padding:16px;">
    <div class="modal-card">
      <div class="modal-title">New Character Name</div>
      <input class="modal-input" id="charInput" type="text" maxlength="16" placeholder="SLAYER" autocomplete="off" spellcheck="false" style="letter-spacing:0.1em;font-size:1.1rem;">
      <div class="modal-actions">
        <button class="pill" type="button" id="charCancelBtn">Cancel</button>
        <button class="pill accent" type="button" id="charGoBtn">Create</button>
      </div>
    </div>
  </div>



<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const imgData = ctx.createImageData(320, 200);
  const loader = document.getElementById('loader');
  const barFill = document.getElementById('barFill');
  const loadStatus = document.getElementById('loadStatus');
  const retryBtn = document.getElementById('retryBtn');
  const joinModal = document.getElementById('joinModal');
  const roomInput = document.getElementById('roomInput');
  const joinCancelBtn = document.getElementById('joinCancelBtn');
  const joinGoBtn = document.getElementById('joinGoBtn');
  const nameModal = document.getElementById('nameModal');
  const charInput = document.getElementById('charInput');
  const charCancelBtn = document.getElementById('charCancelBtn');
  const charGoBtn = document.getElementById('charGoBtn');

  let ex = null;
  let mem = null;
  let booting = false;
  let running = false;
  let muted = false;
  let audioCtx = null;
  let leagueBufPtr = 0;
  let leagueBufCap = 0;
  const leagueCache = { coop: null, dm: null };
  let inLevelPlay = false;
  let uiMenuActive = false;
  let uiMenu = 0;
  let uiMsgState = 0;
  let lastAutoModalMenu = -1;
  let isTouchDevice = (
    ('ontouchstart' in window) ||
    (navigator.maxTouchPoints > 0) ||
    Boolean(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
  );

  // WASI Preview 1 virtual filesystem persisted in HTTP cookies (for character
  // checkpoints profiles/<NAME>.chr, active character profiles/current, and
  // doom.cfg) as well as localStorage (for journals, rotations, and save slots).
  const STORAGE_PREFIX = 'doomach_vfs:';
  const CHR_COOKIE_PREFIX = 'doomach_chr_';
  const CUR_COOKIE = 'doomach_cur';
  const CFG_COOKIE = 'doomach_cfg';
  const COOKIE_MAX_AGE = 315360000; // 10 years
  const vfs = new Map();
  const dirs = new Set(['', 'profiles']);
  const fds = new Map();
  let nextFd = 4;

  function normPath(p) {
    return p.replace(/^\/+|\/+$/g, '').replace(/^\.\//, '');
  }

  function u8ToB64(data) {
    let bin = '';
    for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
    return btoa(bin);
  }

  function b64ToU8(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function cookieNameForPath(path) {
    if (path === 'profiles/current') return CUR_COOKIE;
    if (path === 'doom.cfg') return CFG_COOKIE;
    const m = /^profiles\/([A-Z0-9_]{1,16})\.chr$/.exec(path);
    return m ? CHR_COOKIE_PREFIX + m[1] : null;
  }

  function pathForCookieName(name) {
    if (name === CUR_COOKIE) return 'profiles/current';
    if (name === CFG_COOKIE) return 'doom.cfg';
    if (name.startsWith(CHR_COOKIE_PREFIX)) {
      const charName = name.slice(CHR_COOKIE_PREFIX.length);
      if (/^[A-Z0-9_]{1,16}$/.test(charName)) return 'profiles/' + charName + '.chr';
    }
    return null;
  }

  function writeCookie(cookieName, b64) {
    try {
      if (!cookieName) return;
      if (b64 === null) {
        document.cookie = cookieName + '=; path=/; max-age=0; SameSite=Lax';
      } else {
        document.cookie = cookieName + '=' + encodeURIComponent(b64) + '; path=/; max-age=' + COOKIE_MAX_AGE + '; SameSite=Lax';
      }
    } catch (_) {}
  }

  // Read the 64-bit journal sequence number from a 160-byte DCHR checkpoint
  function chrSeq(u8) {
    if (!u8 || u8.length < 160) return -1n;
    const v = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    if (v.getUint32(0, true) !== 0x52484344) return -1n;
    return v.getBigInt64(48, true);
  }

  function loadPersistedVfs() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(STORAGE_PREFIX)) {
          const path = k.slice(STORAGE_PREFIX.length);
          const b64 = localStorage.getItem(k);
          if (b64 !== null) {
            vfs.set(path, b64ToU8(b64));
            const slash = path.lastIndexOf('/');
            if (slash > 0) dirs.add(path.slice(0, slash));
          }
        }
      }
    } catch (_) {}

    // Load character files and preferences from browser cookies
    try {
      const rawCookies = document.cookie ? document.cookie.split(';') : [];
      for (let i = 0; i < rawCookies.length; i++) {
        const part = rawCookies[i].trim();
        const eq = part.indexOf('=');
        if (eq <= 0) continue;
        const cname = part.slice(0, eq).trim();
        const path = pathForCookieName(cname);
        if (!path) continue;
        const val = decodeURIComponent(part.slice(eq + 1));
        if (!val) continue;
        const arr = b64ToU8(val);
        const existing = vfs.get(path);
        if (!existing || !path.endsWith('.chr') || chrSeq(arr) >= chrSeq(existing)) {
          vfs.set(path, arr);
          const slash = path.lastIndexOf('/');
          if (slash > 0) dirs.add(path.slice(0, slash));
          try { localStorage.setItem(STORAGE_PREFIX + path, val); } catch (_) {}
        }
      }
    } catch (_) {}

    // Ensure any character files present in VFS are also backed up into cookies
    for (const [path, data] of vfs.entries()) {
      const cname = cookieNameForPath(path);
      if (cname && data && data.length > 0) {
        writeCookie(cname, u8ToB64(data));
      }
    }
  }

  function persistFile(path) {
    const data = vfs.get(path);
    const cname = cookieNameForPath(path);
    if (!data) {
      try { localStorage.removeItem(STORAGE_PREFIX + path); } catch (_) {}
      if (cname) writeCookie(cname, null);
      return;
    }
    const b64 = u8ToB64(data);
    if (cname) writeCookie(cname, b64);
    try {
      localStorage.setItem(STORAGE_PREFIX + path, b64);
    } catch (_) {}
  }

  loadPersistedVfs();

  const textDec = new TextDecoder('utf-8');
  const textEnc = new TextEncoder();

  function readStr(ptr, len) {
    return textDec.decode(new Uint8Array(mem.buffer, ptr, len));
  }

  function readCString(ptr, maxLen = 16) {
    const u8 = new Uint8Array(mem.buffer, ptr, maxLen);
    let end = 0;
    while (end < maxLen && u8[end] !== 0) end++;
    return textDec.decode(u8.subarray(0, end));
  }

  const wasi = {
    args_sizes_get(cPtr, sPtr) {
      const v = new DataView(mem.buffer);
      v.setUint32(cPtr, 0, true);
      v.setUint32(sPtr, 0, true);
      return 0;
    },
    args_get() { return 0; },
    environ_sizes_get(cPtr, sPtr) {
      const v = new DataView(mem.buffer);
      v.setUint32(cPtr, 0, true);
      v.setUint32(sPtr, 0, true);
      return 0;
    },
    environ_get() { return 0; },
    fd_prestat_get(fd, out) {
      if (fd !== 3) return 8;
      const v = new DataView(mem.buffer);
      v.setUint32(out, 0, true);
      v.setUint32(out + 4, 1, true);
      return 0;
    },
    fd_prestat_dir_name(fd, namePtr) {
      if (fd !== 3) return 8;
      new Uint8Array(mem.buffer)[namePtr] = 47;
      return 0;
    },
    fd_fdstat_get(fd, out) {
      const v = new DataView(mem.buffer);
      let ft = 4, fl = 0;
      if (fd === 3) ft = 3;
      else if (fds.has(fd)) {
        const e = fds.get(fd);
        ft = e.dir ? 3 : 4;
        fl = e.append ? 1 : 0;
      } else if (fd > 2) return 8;
      v.setUint8(out, ft);
      v.setUint16(out + 2, fl, true);
      v.setBigUint64(out + 8, 0xffffffffffffffffn, true);
      v.setBigUint64(out + 16, 0xffffffffffffffffn, true);
      return 0;
    },
    fd_filestat_get(fd, out) {
      const v = new DataView(mem.buffer);
      for (let i = 0; i < 64; i += 8) v.setBigUint64(out + i, 0n, true);
      if (fd === 3) { v.setUint8(out + 16, 3); return 0; }
      const e = fds.get(fd);
      if (!e) return 8;
      v.setBigUint64(out, 1n, true);
      v.setBigUint64(out + 8, BigInt(fd), true);
      v.setUint8(out + 16, e.dir ? 3 : 4);
      v.setBigUint64(out + 24, 1n, true);
      const data = vfs.get(e.path);
      v.setBigUint64(out + 32, BigInt(data ? data.length : 0), true);
      return 0;
    },
    path_filestat_get(dirfd, flags, pathPtr, pathLen, out) {
      const p = normPath(readStr(pathPtr, pathLen));
      const v = new DataView(mem.buffer);
      for (let i = 0; i < 64; i += 8) v.setBigUint64(out + i, 0n, true);
      if (dirs.has(p)) {
        v.setBigUint64(out, 1n, true);
        v.setUint8(out + 16, 3);
        v.setBigUint64(out + 24, 1n, true);
        return 0;
      }
      if (vfs.has(p)) {
        v.setBigUint64(out, 1n, true);
        v.setUint8(out + 16, 4);
        v.setBigUint64(out + 24, 1n, true);
        v.setBigUint64(out + 32, BigInt(vfs.get(p).length), true);
        return 0;
      }
      return 44;
    },
    path_create_directory(dirfd, pathPtr, pathLen) {
      dirs.add(normPath(readStr(pathPtr, pathLen)));
      return 0;
    },
    path_open(dirfd, dirflags, pathPtr, pathLen, oflags, base, inh, fdflags, outPtr) {
      const p = normPath(readStr(pathPtr, pathLen));
      const wantDir = (oflags & 2) !== 0;
      const creat = (oflags & 1) !== 0;
      const trunc = (oflags & 8) !== 0;
      const append = (fdflags & 1) !== 0;
      if (wantDir || dirs.has(p)) {
        if (!dirs.has(p)) return 44;
        const fd = nextFd++;
        fds.set(fd, { path: p, dir: true, pos: 0, append: false, dirty: false });
        new DataView(mem.buffer).setInt32(outPtr, fd, true);
        return 0;
      }
      if (!vfs.has(p)) {
        if (!creat) return 44;
        vfs.set(p, new Uint8Array(0));
      } else if (trunc) {
        vfs.set(p, new Uint8Array(0));
      }
      const fd = nextFd++;
      fds.set(fd, { path: p, dir: false, pos: append ? vfs.get(p).length : 0, append, dirty: creat || trunc });
      new DataView(mem.buffer).setInt32(outPtr, fd, true);
      return 0;
    },
    fd_read(fd, iovsPtr, iovsLen, donePtr) {
      const e = fds.get(fd);
      if (!e || e.dir) return 8;
      const data = vfs.get(e.path) || new Uint8Array(0);
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let total = 0;
      for (let i = 0; i < iovsLen; i++) {
        const ptr = v.getUint32(iovsPtr + i * 8, true);
        const len = v.getUint32(iovsPtr + i * 8 + 4, true);
        const avail = Math.min(len, Math.max(0, data.length - e.pos));
        if (avail > 0) {
          u8.set(data.subarray(e.pos, e.pos + avail), ptr);
          e.pos += avail;
          total += avail;
        }
      }
      v.setUint32(donePtr, total, true);
      return 0;
    },
    fd_write(fd, iovsPtr, iovsLen, donePtr) {
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let total = 0;
      if (fd === 1 || fd === 2) {
        for (let i = 0; i < iovsLen; i++) total += v.getUint32(iovsPtr + i * 8 + 4, true);
        v.setUint32(donePtr, total, true);
        return 0;
      }
      const e = fds.get(fd);
      if (!e || e.dir) return 8;
      let cur = vfs.get(e.path) || new Uint8Array(0);
      for (let i = 0; i < iovsLen; i++) {
        const ptr = v.getUint32(iovsPtr + i * 8, true);
        const len = v.getUint32(iovsPtr + i * 8 + 4, true);
        const chunk = u8.slice(ptr, ptr + len);
        const at = e.append ? cur.length : e.pos;
        const next = new Uint8Array(Math.max(cur.length, at + len));
        next.set(cur);
        next.set(chunk, at);
        cur = next;
        e.pos = at + len;
        total += len;
      }
      vfs.set(e.path, cur);
      e.dirty = true;
      v.setUint32(donePtr, total, true);
      return 0;
    },
    fd_readdir(fd, bufPtr, bufLen, cookie, usedPtr) {
      const e = fds.get(fd);
      if (!e || !e.dir) return 8;
      const prefix = e.path ? e.path + '/' : '';
      const entries = [];
      for (const k of vfs.keys()) {
        if (k.startsWith(prefix)) {
          const rest = k.slice(prefix.length);
          if (rest && !rest.includes('/')) entries.push({ name: rest, kind: 4 });
        }
      }
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let off = 0;
      for (let i = Number(cookie); i < entries.length; i++) {
        const nb = textEnc.encode(entries[i].name);
        if (off + 24 + nb.length > bufLen) break;
        v.setBigUint64(bufPtr + off, BigInt(i + 1), true);
        v.setBigUint64(bufPtr + off + 8, BigInt(i + 100), true);
        v.setUint32(bufPtr + off + 16, nb.length, true);
        v.setUint8(bufPtr + off + 20, entries[i].kind);
        u8.set(nb, bufPtr + off + 24);
        off += 24 + nb.length;
      }
      v.setUint32(usedPtr, off, true);
      return 0;
    },
    fd_sync(fd) {
      const e = fds.get(fd);
      if (e && !e.dir && e.dirty) {
        persistFile(e.path);
        e.dirty = false;
      }
      return 0;
    },
    fd_close(fd) {
      const e = fds.get(fd);
      if (e && !e.dir && e.dirty) persistFile(e.path);
      fds.delete(fd);
      return 0;
    },
    path_rename(ofd, opPtr, opLen, nfd, npPtr, npLen) {
      const op = normPath(readStr(opPtr, opLen));
      const np = normPath(readStr(npPtr, npLen));
      if (!vfs.has(op)) return 44;
      vfs.set(np, vfs.get(op));
      vfs.delete(op);
      persistFile(op);
      persistFile(np);
      return 0;
    },
    path_unlink_file(dirfd, pPtr, pLen) {
      const p = normPath(readStr(pPtr, pLen));
      if (!vfs.has(p)) return 44;
      vfs.delete(p);
      persistFile(p);
      return 0;
    },
    path_remove_directory(dirfd, pPtr, pLen) {
      dirs.delete(normPath(readStr(pPtr, pLen)));
      return 0;
    },
    random_get(ptr, len) {
      crypto.getRandomValues(new Uint8Array(mem.buffer, ptr, len));
      return 0;
    },
    proc_exit() {}
  };

  // Multiplayer transport: persistent binary WebSocket with HTTP /net/** fallback
  const clientIdBytes = new Uint8Array(4);
  crypto.getRandomValues(clientIdBytes);
  clientIdBytes[0] |= 1;
  const clientIdHex = Array.from(clientIdBytes, (b) => b.toString(16).padStart(2, '0')).join('');

  let ws = null;
  let wsConnected = false;
  let wsConnecting = false;
  let wsLastTry = 0;
  let wsFailures = 0;
  let httpInFlight = false;
  let httpLastPoll = 0;
  let httpPendingHex = [];
  let netActiveUntil = 0;

  function toHex(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i++) {
      const h = u8[i].toString(16);
      s += h.length === 1 ? '0' + h : h;
    }
    return s;
  }

  function pushIncomingBytes(u8) {
    if (!ex || !mem || u8.length < 16 || u8.length > 1500) return;
    const tPtr = ex.web_transfer_ptr();
    new Uint8Array(mem.buffer, tPtr, u8.length).set(u8);
    ex.web_net_push(tPtr, u8.length);
  }

  function connectWebSocket() {
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (wsConnected || wsConnecting || (!isLocal && wsFailures >= 2)) return;
    const now = performance.now();
    if (now - wsLastTry < 4000) return;
    wsLastTry = now;
    wsConnecting = true;
    try {
      const wsUrl = isLocal
        ? 'ws://' + location.hostname + ':5030/ws'
        : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':5029/ws';
      const sock = new WebSocket(wsUrl);
      sock.binaryType = 'arraybuffer';
      sock.onopen = () => {
        ws = sock;
        wsConnected = true;
        wsConnecting = false;
        wsFailures = 0;
      };
      sock.onmessage = (ev) => {
        if (ev.data instanceof ArrayBuffer) {
          pushIncomingBytes(new Uint8Array(ev.data));
        }
      };
      sock.onclose = () => {
        if (ws === sock) ws = null;
        if (!wsConnected) wsFailures++;
        wsConnected = false;
        wsConnecting = false;
      };
      sock.onerror = () => {
        wsConnecting = false;
      };
    } catch (_) {
      wsFailures++;
      wsConnecting = false;
    }
  }

  async function flushHttpNet() {
    if (httpInFlight || !ex) return;
    const now = performance.now();
    const hasOut = httpPendingHex.length > 0;
    if (!hasOut && (now > netActiveUntil || now - httpLastPoll < 42)) return;
    httpInFlight = true;
    httpLastPoll = now;
    const batch = hasOut ? httpPendingHex.splice(0, 8).join('.') : '0';
    try {
      const res = await fetch('/net/' + clientIdHex + '/' + batch, { cache: 'no-store' });
      if (res.ok) {
        const buf = new Uint8Array(await res.arrayBuffer());
        let off = 0;
        while (off + 2 <= buf.length) {
          const plen = buf[off] | (buf[off + 1] << 8);
          off += 2;
          if (plen > 0 && off + plen <= buf.length) {
            pushIncomingBytes(buf.subarray(off, off + plen));
          }
          off += plen;
        }
      }
    } catch (_) {
    } finally {
      httpInFlight = false;
      if (httpPendingHex.length > 0 && !wsConnected) {
        flushHttpNet();
      }
    }
  }

  function pumpNet() {
    if (!ex || !mem) return;
    const tPtr = ex.web_transfer_ptr();
    let sentAny = false;
    while (true) {
      const len = ex.web_net_pop(tPtr, 1400);
      if (len <= 0) break;
      sentAny = true;
      const pkt = new Uint8Array(mem.buffer, tPtr, len).slice();
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(pkt);
      } else {
        connectWebSocket();
        httpPendingHex.push(toHex(pkt));
        if (httpPendingHex.length > 48) httpPendingHex.shift();
      }
    }
    if (sentAny) {
      netActiveUntil = performance.now() + 8000;
    }
    if (!wsConnected) {
      flushHttpNet();
    }

    // Update mobile UI state (menu vs level gameplay, virtual keyboard modals)
    if (ex.web_ui_state) {
      const playingNow = ex.web_ui_state(tPtr) === 1;
      const uis = new Int32Array(mem.buffer, tPtr, 5);
      const menuAct = uis[1] !== 0, menuId = uis[2], msgSt = uis[3];
      if (playingNow !== inLevelPlay || menuAct !== uiMenuActive || menuId !== uiMenu || msgSt !== uiMsgState) {
        inLevelPlay = playingNow;
        uiMenuActive = menuAct;
        uiMenu = menuId;
        uiMsgState = msgSt;
        if (isTouchDevice && menuAct && msgSt === 0) {
          if (menuId === 14 && lastAutoModalMenu !== 14) {
            lastAutoModalMenu = 14;
            openNameModal();
          } else if (menuId === 8 && lastAutoModalMenu !== 8) {
            lastAutoModalMenu = 8;
            joinModal.classList.add('open');
            roomInput.value = '';
            setTimeout(() => roomInput.focus(), 30);
          }
        }
        if (!menuAct || (menuId !== 14 && menuId !== 8)) {
          lastAutoModalMenu = -1;
        }
      }
    }
  }

  function mapKey(e) {
    switch (e.code) {
      case 'ArrowUp': return 0x26;
      case 'ArrowDown': return 0x28;
      case 'ArrowLeft': return 0x25;
      case 'ArrowRight': return 0x27;
      case 'Enter':
      case 'NumpadEnter': return 0x0d;
      case 'Escape': return 0x1b;
      case 'Backspace': return 0x08;
      case 'Tab': return 0x09;
      case 'Space': return 0x20;
      case 'ShiftLeft':
      case 'ShiftRight': return 0x10;
      case 'ControlLeft':
      case 'ControlRight': return 0x11;
      case 'F12': return 0x7b;
      case 'Minus': return e.shiftKey ? 95 : 45;
      case 'Equal': return e.shiftKey ? 43 : 61;
    }
    if (e.code && e.code.startsWith('Key') && e.code.length === 4) {
      return e.code.charCodeAt(3);
    }
    if (e.code && e.code.startsWith('Digit') && e.code.length === 6) {
      return e.code.charCodeAt(5);
    }
    if (e.key && e.key.length === 1) {
      const c = e.key.toUpperCase().charCodeAt(0);
      if (c >= 32 && c < 127) return c;
    }
    return 0;
  }

  function setupAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      const srcRate = 11025;
      const dstRate = audioCtx.sampleRate;
      const proc = audioCtx.createScriptProcessor(2048, 0, 2);
      let frac = 0;
      let lastL = 0, lastR = 0;
      proc.onaudioprocess = (ev) => {
        const outL = ev.outputBuffer.getChannelData(0);
        const outR = ev.outputBuffer.getChannelData(1);
        const n = outL.length;
        if (!running || muted || !ex) {
          outL.fill(0);
          outR.fill(0);
          return;
        }
        const step = srcRate / dstRate;
        const needed = Math.min(4096, Math.ceil((n * step) + frac) + 2);
        const pcmPtr = ex.web_audio(needed);
        const pcm = new Int16Array(mem.buffer, pcmPtr, needed * 2);
        let idx = 0;
        for (let i = 0; i < n; i++) {
          frac += step;
          while (frac >= 1 && idx < needed) {
            lastL = pcm[idx * 2] / 32768;
            lastR = pcm[idx * 2 + 1] / 32768;
            idx++;
            frac -= 1;
          }
          outL[i] = lastL;
          outR[i] = lastR;
        }
      };
      proc.connect(audioCtx.destination);
    } catch (_) {}
  }

  async function fetchBytes(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(url + ' (' + res.status + ')');
    return new Uint8Array(await res.arrayBuffer());
  }

  async function handleAction(act) {
    if (!ex) return;
    const tPtr = ex.web_transfer_ptr();
    if (act === 2) {
      try {
        const bytes = await fetchBytes('league/watch.bin?t=' + Date.now());
        new Uint8Array(mem.buffer, tPtr, bytes.length).set(bytes);
        ex.web_watch_dm_load(bytes.length);
      } catch (_) {
        ex.web_watch_dm_load(0);
      }
    } else if (act === 1) {
      try {
        const nowBytes = await fetchBytes('league/coopnow.bin?t=' + Date.now());
        let tickBytes = new Uint8Array(0);
        try { tickBytes = await fetchBytes('league/coopnow.tic?t=' + Date.now()); } catch (_) {}
        const u8 = new Uint8Array(mem.buffer);
        u8.set(nowBytes.subarray(0, 6492), tPtr);
        if (tickBytes.length > 0) u8.set(tickBytes.subarray(0, 16), tPtr + 6492);
        ex.web_watch_coop_load(nowBytes.length, tickBytes.length);
      } catch (_) {
        ex.web_watch_coop_load(0, 0);
      }
    } else if (act === 3 || act === 4) {
      const isCoop = act === 3;
      const key = isCoop ? 'coop' : 'dm';
      const url = isCoop ? 'league/coop.bin' : 'league/league.bin';
      if (!leagueCache[key]) {
        try {
          leagueCache[key] = await fetchBytes(url + '?t=' + Date.now());
        } catch (_) {
          leagueCache[key] = null;
        }
      }
      const data = leagueCache[key];
      const seed = (Date.now() & 0x7fffffff) | 1;
      if (data && data.length > 0) {
        if (leagueBufCap < data.length) {
          leagueBufPtr = ex.web_alloc(data.length);
          leagueBufCap = data.length;
        }
        new Uint8Array(mem.buffer, leagueBufPtr, data.length).set(data);
        ex.web_start_bot_game(leagueBufPtr, data.length, seed);
      } else {
        ex.web_start_bot_game(0, 0, seed);
      }
    }
  }

  function joinRoomByCode(rawCode) {
    if (!ex || !mem) return false;
    const clean = (rawCode || '').trim().toUpperCase();
    if (clean.length !== 6) return false;
    const tPtr = ex.web_transfer_ptr();
    const u8 = new Uint8Array(mem.buffer, tPtr, 8);
    for (let i = 0; i < 6; i++) u8[i] = clean.charCodeAt(i);
    u8[6] = 0;
    return ex.web_join_room(tPtr) === 1;
  }

  async function boot() {
    if (running) {
      canvas.focus();
      return;
    }
    if (booting) return;
    booting = true;
    retryBtn.style.display = 'none';
    barFill.style.width = '30%';
    loadStatus.textContent = 'Loading doom.wasm and DOOM1.WAD...';
    connectWebSocket();

    try {
      const [wasmRes, wadRes] = await Promise.all([
        fetch('doom.wasm'),
        fetch('DOOM1.WAD')
      ]);
      if (!wasmRes.ok) throw new Error('Could not load doom.wasm');
      if (!wadRes.ok) throw new Error('Could not load DOOM1.WAD');
      barFill.style.width = '65%';
      const [wasmBuf, wadBuf] = await Promise.all([
        wasmRes.arrayBuffer(),
        wadRes.arrayBuffer()
      ]);
      barFill.style.width = '85%';
      loadStatus.textContent = 'Starting deterministic simulation...';
      const wadBytes = new Uint8Array(wadBuf);
      const { instance } = await WebAssembly.instantiate(wasmBuf, {
        wasi_snapshot_preview1: wasi
      });
      ex = instance.exports;
      mem = ex.memory;

      const wadPtr = ex.web_alloc(wadBytes.length);
      new Uint8Array(mem.buffer, wadPtr, wadBytes.length).set(wadBytes);
      const rc = ex.web_init(wadPtr, wadBytes.length);
      if (rc !== 0) throw new Error('web_init returned ' + rc);

      barFill.style.width = '100%';
      loader.classList.add('hidden');
      canvas.focus();
      running = true;

      // Check for ?room=CODE or #CODE invite link in the URL
      const params = new URLSearchParams(location.search);
      const urlRoom = params.get('room') || (location.hash ? location.hash.slice(1) : '');
      if (urlRoom && urlRoom.trim().length === 6) {
        joinRoomByCode(urlRoom);
      }

      const TIC_MS = 1000 / 35;
      let nextTic = performance.now();

      function frame(now) {
        let steps = 0;
        while (now >= nextTic && steps < 4) {
          stepTouchPads(now);
          ex.web_tic();
          pumpNet();
          const act = ex.web_poll_action();
          if (act !== 0) handleAction(act);
          nextTic += TIC_MS;
          steps++;
        }
        if (now >= nextTic) nextTic = now;
        if (steps > 0) {
          const rgbaPtr = ex.web_draw();
          imgData.data.set(new Uint8ClampedArray(mem.buffer, rgbaPtr, 320 * 200 * 4));
          ctx.putImageData(imgData, 0, 0);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    } catch (err) {
      booting = false;
      retryBtn.style.display = 'inline-block';
      loadStatus.textContent = String(err.message || err);
    }
  }

  retryBtn.addEventListener('click', () => {
    setupAudio();
    boot();
  });

  joinCancelBtn.addEventListener('click', () => {
    joinModal.classList.remove('open');
    if (ex && uiMenuActive && uiMenu === 8) tapKey(0x08);
    canvas.focus();
  });

  function submitJoinModal() {
    const code = roomInput.value.trim().toUpperCase();
    if (code.length === 6) {
      joinModal.classList.remove('open');
      joinRoomByCode(code);
      canvas.focus();
    }
  }

  joinGoBtn.addEventListener('click', submitJoinModal);
  roomInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      submitJoinModal();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      joinModal.classList.remove('open');
      if (ex && uiMenuActive && uiMenu === 8) tapKey(0x08);
      canvas.focus();
    }
  });

  function openNameModal() {
    if (document.pointerLockElement === canvas) document.exitPointerLock();
    nameModal.style.display = 'flex';
    charInput.value = '';
    setTimeout(() => charInput.focus(), 30);
  }

  function closeNameModal() {
    nameModal.style.display = 'none';
    canvas.focus();
  }

  function submitNameModal() {
    const clean = (charInput.value || '').trim().toUpperCase().replace(/[^A-Z0-9_]/g, '');
    if (clean.length >= 1 && clean.length <= 16 && ex && ex.web_create_char) {
      const tPtr = ex.web_transfer_ptr();
      const u8 = new Uint8Array(mem.buffer, tPtr, 24);
      for (let i = 0; i < clean.length; i++) u8[i] = clean.charCodeAt(i);
      u8[clean.length] = 0;
      ex.web_create_char(tPtr);
      closeNameModal();
    }
  }

  charCancelBtn.addEventListener('click', () => {
    closeNameModal();
    if (ex && uiMenuActive && uiMenu === 14) tapKey(0x08);
  });
  charGoBtn.addEventListener('click', submitNameModal);
  charInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      submitNameModal();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeNameModal();
    }
  });

  function tapKey(code) {
    if (!ex) return;
    ex.web_key_down(code, 0);
    setTimeout(() => {
      if (ex) ex.web_key_up(code);
    }, 55);
  }

  function canvasCoords(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    const x = Math.max(0, Math.min(319, Math.floor(((clientX - r.left) / r.width) * 320)));
    const y = Math.max(0, Math.min(199, Math.floor(((clientY - r.top) / r.height) * 200)));
    return { x, y };
  }

  window.addEventListener('keydown', (e) => {
    if (joinModal.classList.contains('open') || nameModal.style.display === 'flex') return;
    setupAudio();
    if (!running || !ex) return;
    const k = mapKey(e);
    if (k !== 0) {
      e.preventDefault();
      if (k === 0x1b && document.pointerLockElement === canvas) {
        document.exitPointerLock();
      }
      ex.web_key_down(k, e.repeat ? 1 : 0);
    }
  });

  window.addEventListener('keyup', (e) => {
    if (joinModal.classList.contains('open') || nameModal.style.display === 'flex') return;
    if (!running || !ex) return;
    const k = mapKey(e);
    if (k !== 0) {
      e.preventDefault();
      ex.web_key_up(k);
    }
  });

  window.addEventListener('blur', () => {
    if (ex) ex.web_release_all();
  });

  let pointerLockEnteredAt = 0;
  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === canvas) {
      pointerLockEnteredAt = performance.now();
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (isTouchDevice) return;
    canvas.focus();
    setupAudio();
    if (!running || !ex) return;
    if (document.pointerLockElement !== canvas) {
      if (ex.web_want_pointer_lock() === 1) {
        try {
          const p = canvas.requestPointerLock({ unadjustedMovement: true });
          if (p && typeof p.catch === 'function') {
            p.catch(() => canvas.requestPointerLock?.());
          }
        } catch (_) {
          canvas.requestPointerLock?.();
        }
      } else if (e.button === 0 && ex.web_canvas_tap) {
        const pt = canvasCoords(e.clientX, e.clientY);
        if (pt) ex.web_canvas_tap(pt.x, pt.y);
      }
      return;
    }
    if (document.pointerLockElement === canvas) {
      e.preventDefault();
      ex.web_mouse_button(e.button, 1);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (isTouchDevice || !running || !ex) return;
    ex.web_mouse_button(e.button, 0);
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('mousemove', (e) => {
    if (!running || !ex) return;
    if (document.pointerLockElement === canvas) {
      if (performance.now() - pointerLockEnteredAt < 45) return;
      const dx = e.movementX | 0;
      if (Math.abs(dx) > 220) return;
      ex.web_mouse_move(dx);
    }
  });

  // Invisible dual-analog joysticks + gesture controls:
  // - Left half of screen:  Move stick, centered wherever the user first presses and holds
  // - Right half of screen: Look stick, centered wherever the user first presses and holds
  // - Both sticks work simultaneously for dual-thumb play:
  //   * Bottom 80% of stick throw (0 <= u < 0.8): linear lerp curve from 0 up to 1.0 (max speed)
  //   * Top 20% of stick throw (u >= 0.8): 1.0 (max speed all the way)
  //   * Fixed origin per hold: the stick center locks where the thumb first presses and holds
  //     and never shifts while held, so returning the thumb to its starting spot always stops cleanly.
  // - 1-finger tap:         shoot (in gameplay) or select menu row
  // - Simultaneous 2-finger tap: open door / use switch (in gameplay) or go back / cancel (in menus)
  // - Swipe left / right:   change weapon (in gameplay) or back / select (in menus)
  // - Simultaneous 3-finger tap: open / close main menu (Esc)
  const activeTouches = new Map();
  let movePadTouchId = null;
  let lookPadTouchId = null;
  let multiChordFingers = 0;
  let multiChordStart = 0;
  let multiChordMaxMove = 0;
  let multiChordValid = false;

  const STICK_DEAD = 8;
  const STICK_RADIUS = 64;
  const MAX_MOVE_FWD = 50;   // FORWARDMOVE[1]
  const MAX_MOVE_SIDE = 40;  // SIDEMOVE[1]
  const MAX_LOOK_TURN = 64;  // 64 * MOUSETURN(10) = 640 = ANGLETURN[0] (Doom max normal turn speed)
  let turnCarry = 0;

  function stickCurve(deflection) {
    if (deflection <= STICK_DEAD) return 0;
    const u = Math.min(1, (deflection - STICK_DEAD) / (STICK_RADIUS - STICK_DEAD));
    if (u >= 0.8) return 1;
    return u / 0.8; // 0..1 linear lerp across the bottom 80%
  }

  function clearInvisiblePads() {
    movePadTouchId = null;
    lookPadTouchId = null;
    turnCarry = 0;
    if (ex && ex.web_touch_move) ex.web_touch_move(0, 0);
  }

  function pulseKey(code, durationMs = 85) {
    if (!ex) return;
    ex.web_key_down(code, 0);
    setTimeout(() => {
      if (ex) ex.web_key_up(code);
    }, durationMs);
  }

  function stepMenuDrag(t) {
    const stepY = t.curY - t.stepY;
    const stepX = t.curX - t.stepX;
    if (Math.abs(stepY) >= 26) {
      t.stepY = t.curY;
      tapKey(stepY > 0 ? 0x28 : 0x26);
    } else if (Math.abs(stepX) >= 28 && uiMenu === 4) {
      t.stepX = t.curX;
      tapKey(stepX > 0 ? 0x27 : 0x25);
    }
  }

  // Settle the stick center where the thumb first presses and holds, and detect fast
  // horizontal weapon-switch flicks so swiping a weapon never jumps the camera.
  function updateStickHoldState(rec, now) {
    const age = now - rec.startTime;
    const rawDx = rec.curX - rec.startX;
    const rawDy = rec.curY - rec.startY;

    if (!rec.anchored) {
      // If the finger immediately launches horizontally at high velocity without holding first,
      // treat it as a weapon-switch swipe candidate so it doesn't spin the camera.
      if (age < 75 && Math.abs(rawDx) >= 26 && Math.abs(rawDx) > Math.abs(rawDy) * 1.6) {
        rec.swipeCandidate = true;
        rec.anchored = true;
      } else if (age >= 50) {
        if (rec.maxMove <= 10) {
          rec.originX = rec.curX;
          rec.originY = rec.curY;
        }
        rec.anchored = true;
      } else if (rec.maxMove > 14) {
        rec.anchored = true;
      }
    }

    // If a swipe candidate stays held on the screen past 250ms, the user is holding the stick,
    // so re-anchor the stick center right where their thumb is holding.
    if (rec.swipeCandidate && age >= 250) {
      rec.swipeCandidate = false;
      rec.originX = rec.curX;
      rec.originY = rec.curY;
    }
  }

  // Called once per 35 Hz game tic to feed both virtual analog sticks into doom.wasm simultaneously
  function stepTouchPads(now) {
    if (!ex) return;
    if (!inLevelPlay || multiChordValid) {
      turnCarry = 0;
      if (ex.web_touch_move) ex.web_touch_move(0, 0);
      return;
    }

    // 1. Left virtual analog stick (Move: bottom 80% lerps 0..max, top 20% = max all the way)
    let fwd = 0;
    let side = 0;
    const moveRec = movePadTouchId !== null ? activeTouches.get(movePadTouchId) : null;
    if (moveRec) {
      updateStickHoldState(moveRec, now);
      if (moveRec.anchored && !moveRec.swipeCandidate) {
        const dx = moveRec.curX - moveRec.originX;
        const dy = moveRec.curY - moveRec.originY;
        const dist = Math.hypot(dx, dy);
        if (dist > STICK_DEAD) {
          const mag = stickCurve(dist);
          fwd = Math.round((-dy / dist) * mag * MAX_MOVE_FWD);
          side = Math.round((dx / dist) * mag * MAX_MOVE_SIDE);
        }
      }
    }
    if (ex.web_touch_move) {
      ex.web_touch_move(fwd, side);
    }

    // 2. Right virtual analog stick (Look: bottom 80% lerps 0..max rotation speed, top 20% = max all the way)
    let lookRate = 0;
    const lookRec = lookPadTouchId !== null ? activeTouches.get(lookPadTouchId) : null;
    if (lookRec) {
      updateStickHoldState(lookRec, now);
      if (lookRec.anchored && !lookRec.swipeCandidate) {
        const dx = lookRec.curX - lookRec.originX;
        const absDx = Math.abs(dx);
        if (absDx > STICK_DEAD) {
          const mag = stickCurve(absDx);
          lookRate = Math.sign(dx) * mag * MAX_LOOK_TURN;
        }
      }
    } else {
      turnCarry = 0;
    }

    const totalTurn = lookRate + turnCarry;
    const intTurn = Math.trunc(totalTurn);
    turnCarry = totalTurn - intTurn;
    if (intTurn !== 0 && ex.web_mouse_move) {
      ex.web_mouse_move(intTurn);
    }
  }

  function isUiOverlayTarget(target) {
    return Boolean(target && target.closest && target.closest('#joinModal, #nameModal, .retry-btn'));
  }

  window.addEventListener('touchstart', (e) => {
    isTouchDevice = true;
    setupAudio();
    if (isUiOverlayTarget(e.target)) {
      return;
    }
    e.preventDefault();
    const now = performance.now();
    const wasEmpty = activeTouches.size === 0;
    const midX = window.innerWidth * 0.5;

    for (let i = 0; i < e.changedTouches.length; i++) {
      const ct = e.changedTouches[i];
      const side = ct.clientX < midX ? 'left' : 'right';
      const rec = {
        id: ct.identifier,
        side,
        startX: ct.clientX,
        startY: ct.clientY,
        originX: ct.clientX,
        originY: ct.clientY,
        curX: ct.clientX,
        curY: ct.clientY,
        lastX: ct.clientX,
        lastY: ct.clientY,
        stepX: ct.clientX,
        stepY: ct.clientY,
        startTime: now,
        lastMoveTime: now,
        maxMove: 0,
        anchored: false,
        swipeCandidate: false
      };
      activeTouches.set(ct.identifier, rec);
      if (side === 'left' && movePadTouchId === null) {
        movePadTouchId = ct.identifier;
      } else if (side === 'right' && lookPadTouchId === null) {
        lookPadTouchId = ct.identifier;
        turnCarry = 0;
      }
    }

    // Detect simultaneous multi-finger tap chords (2-finger tap = open door, 3-finger tap = menu)
    // without interfering with dual-thumb joystick play (where one thumb is already holding a stick)
    if (wasEmpty) {
      multiChordStart = now;
      multiChordFingers = activeTouches.size;
      multiChordMaxMove = 0;
      multiChordValid = activeTouches.size >= 2;
    } else if (now - multiChordStart < 95) {
      let allNearRest = true;
      for (const r of activeTouches.values()) {
        if (r.maxMove > 18) allNearRest = false;
      }
      if (allNearRest) {
        multiChordFingers = Math.max(multiChordFingers, activeTouches.size);
        multiChordValid = multiChordFingers >= 2;
      }
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (activeTouches.size === 0) return;
    e.preventDefault();
    const now = performance.now();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const ct = e.changedTouches[i];
      const rec = activeTouches.get(ct.identifier);
      if (!rec) continue;
      const stepDist = Math.hypot(ct.clientX - rec.curX, ct.clientY - rec.curY);
      if (stepDist >= 1.2) {
        rec.lastMoveTime = now;
      }
      rec.lastX = rec.curX;
      rec.lastY = rec.curY;
      rec.curX = ct.clientX;
      rec.curY = ct.clientY;
      const mv = Math.hypot(rec.curX - rec.startX, rec.curY - rec.startY);
      if (mv > rec.maxMove) rec.maxMove = mv;
      if (mv > multiChordMaxMove) multiChordMaxMove = mv;
      if (multiChordValid && multiChordMaxMove > 26) {
        multiChordValid = false;
      }

      if (!inLevelPlay) {
        stepMenuDrag(rec);
      } else {
        updateStickHoldState(rec, now);
      }
    }
  }, { passive: false });

  function handleTouchEnd(e, isCancel) {
    if (activeTouches.size === 0) return;
    e.preventDefault();
    const now = performance.now();
    const endedTouches = [];

    for (let i = 0; i < e.changedTouches.length; i++) {
      const ct = e.changedTouches[i];
      const rec = activeTouches.get(ct.identifier);
      if (rec) {
        rec.curX = ct.clientX;
        rec.curY = ct.clientY;
        const mv = Math.hypot(rec.curX - rec.startX, rec.curY - rec.startY);
        if (mv > rec.maxMove) rec.maxMove = mv;
        if (mv > multiChordMaxMove) multiChordMaxMove = mv;
        endedTouches.push(rec);
        activeTouches.delete(ct.identifier);
      }
      if (ct.identifier === movePadTouchId) {
        movePadTouchId = null;
        if (ex && ex.web_touch_move) {
          ex.web_touch_move(0, 0);
        }
      }
      if (ct.identifier === lookPadTouchId) {
        lookPadTouchId = null;
        turnCarry = 0;
      }
    }

    if (isCancel || !ex) {
      if (activeTouches.size === 0) {
        multiChordValid = false;
        clearInvisiblePads();
      }
      return;
    }

    // 1. Simultaneous 2-finger or 3-finger chord tap when all fingers in the chord lift
    if (multiChordValid && activeTouches.size === 0) {
      const chordDt = now - multiChordStart;
      multiChordValid = false;
      if (multiChordFingers >= 3 && chordDt < 360 && multiChordMaxMove < 34) {
        tapKey(0x1b); // 3-finger tap: toggle main menu (Esc)
        return;
      }
      if (multiChordFingers === 2 && chordDt < 340 && multiChordMaxMove < 28) {
        if (inLevelPlay) {
          pulseKey(0x20, 90); // 2-finger tap: open door / use switch (Space)
        } else if (uiMsgState === 2) {
          tapKey(78); // 'N' on Y/N prompt
        } else {
          tapKey(0x08); // Backspace in menu
        }
        return;
      }
    }
    if (activeTouches.size === 0) {
      multiChordValid = false;
    }

    // 2. Individual finger release gestures (works even while the other thumb is holding a stick!)
    for (let i = 0; i < endedTouches.length; i++) {
      const ended = endedTouches[i];
      const dx = ended.curX - ended.startX;
      const dy = ended.curY - ended.startY;
      const singleDt = now - ended.startTime;

      // Fast horizontal swipe left / right -> change weapon (in gameplay) or back / select (in menu)
      if (singleDt < 240 && Math.abs(dx) >= 44 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        if (inLevelPlay) {
          if (ex.web_cycle_weapon) {
            ex.web_cycle_weapon(dx > 0 ? 1 : -1);
          } else {
            const code = 48 + weaponCycle;
            weaponCycle = (weaponCycle % 7) + 1;
            tapKey(code);
          }
        } else {
          tapKey(dx > 0 ? 0x0d : 0x08);
        }
        continue;
      }

      // 1-finger tap -> shoot (in gameplay) or select menu row / confirm prompt (in menus)
      if (singleDt < 240 && ended.maxMove < 16) {
        if (inLevelPlay) {
          pulseKey(0x11, 90); // VK_CONTROL (Fire / Shoot)
        } else if (uiMenuActive && uiMenu === 14) {
          openNameModal();
        } else if (uiMenuActive && uiMenu === 8) {
          joinModal.classList.add('open');
          roomInput.value = '';
          setTimeout(() => roomInput.focus(), 30);
        } else {
          const r = canvas.getBoundingClientRect();
          const insideCanvas = (
            ended.curX >= r.left && ended.curX <= r.right &&
            ended.curY >= r.top && ended.curY <= r.bottom
          );
          const pt = insideCanvas ? canvasCoords(ended.curX, ended.curY) : null;
          if (pt && ex.web_canvas_tap) {
            ex.web_canvas_tap(pt.x, pt.y);
          } else {
            tapKey(0x0d);
          }
        }
      }
    }
  }

  window.addEventListener('touchend', (e) => handleTouchEnd(e, false), { passive: false });
  window.addEventListener('touchcancel', (e) => handleTouchEnd(e, true), { passive: false });

  const flushProfileToCookie = () => {
    if (ex && ex.web_flush_profile) ex.web_flush_profile();
  };
  window.addEventListener('pagehide', flushProfileToCookie);
  window.addEventListener('beforeunload', flushProfileToCookie);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushProfileToCookie();
  });

  // Auto-boot immediately into the 4:3 browser runtime
  boot(0);
})();
</script>
</body>
</html>
