<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DOOMACH</title>
<meta name="description" content="Doom in Mach 7.0 (wasi-wasm32) — full-screen 4:3 browser runtime with online lockstep co-op, deathmatch, and neural-network bot leagues.">
<style>
  :root {
    --accent: #d8362c;
    --accent-bright: #ff5247;
    --hud-bg: rgba(14, 12, 11, 0.82);
    --hud-border: rgba(255, 255, 255, 0.16);
    --hud-fg: #f0ebe3;
    --hud-muted: #a99f94;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    color: var(--hud-fg);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Maximal 4:3 fit inside the viewport:
     - Landscape / desktop: full height (100dvh), width clamped to 4:3
     - Portrait / mobile:   full width (100vw), height clamped to 4:3 */
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    aspect-ratio: 4 / 3;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.9);
  }
  #screen {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    cursor: crosshair;
  }
  #loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at center, rgba(28, 14, 12, 0.88), rgba(0, 0, 0, 0.96));
    padding: 24px;
    text-align: center;
    z-index: 20;
    transition: opacity 0.25s ease;
  }
  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loader-title {
    font: 800 2rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: 0.12em;
    color: var(--accent-bright);
    text-shadow: 0 2px 16px rgba(216, 54, 44, 0.55);
  }
  .loader-sub {
    color: var(--hud-muted);
    font-size: 0.9rem;
    max-width: 380px;
  }
  .bar-track {
    width: min(280px, 75%);
    height: 6px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 25%;
    background: var(--accent-bright);
    transition: width 0.2s ease;
  }
  .retry-btn {
    display: none;
    appearance: none;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    font: 600 0.95rem/1.2 inherit;
    cursor: pointer;
  }
  /* Auto-hiding floating HUD bar */
  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    left: max(10px, env(safe-area-inset-left));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    z-index: 30;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  #hud.idle {
    opacity: 0;
  }
  #hud:hover, #hud:focus-within {
    opacity: 1 !important;
  }
  .hud-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    pointer-events: auto;
  }
  .pill {
    appearance: none;
    border: 1px solid var(--hud-border);
    background: var(--hud-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--hud-fg);
    border-radius: 6px;
    padding: 5px 10px;
    font: 600 0.78rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .pill:hover {
    border-color: var(--accent-bright);
    color: #fff;
  }
  .pill.accent {
    background: rgba(179, 32, 26, 0.88);
    border-color: rgba(255, 110, 95, 0.45);
    color: #fff;
  }
  .pill.room-pill {
    display: none;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: 0.04em;
    background: rgba(30, 110, 52, 0.9);
    border-color: rgba(110, 235, 145, 0.5);
  }
  .net-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #888;
    margin-right: 5px;
    vertical-align: middle;
  }
  .net-dot.live { background: #3ad46b; }
  .net-dot.http { background: #f0b429; }

  /* Room code join modal */
  #joinModal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 50;
    padding: 16px;
  }
  #joinModal.open {
    display: flex;
  }
  .modal-card {
    background: #181412;
    border: 1px solid var(--hud-border);
    border-radius: 10px;
    padding: 18px 20px;
    width: min(320px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
  }
  .modal-title {
    font-weight: 700;
    font-size: 1rem;
  }
  .modal-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--hud-border);
    background: #0d0b0a;
    color: #fff;
    font: 700 1.25rem/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    text-align: center;
    outline: none;
  }
  .modal-input:focus {
    border-color: var(--accent-bright);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* Touch controls for mobile / tablet */
  #touchControls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    display: none;
  }
  body.touch-active #touchControls {
    display: block;
  }
  .touch-pad {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: max(16px, env(safe-area-inset-left));
    width: 144px;
    height: 144px;
    pointer-events: auto;
  }
  .dpad-btn {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 18, 16, 0.58);
    color: rgba(255, 255, 255, 0.88);
    font: 700 0.85rem/1 system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad-btn.active, .act-btn.active {
    background: rgba(216, 54, 44, 0.78);
    border-color: rgba(255, 160, 150, 0.85);
  }
  .dpad-up    { top: 0; left: 49px; }
  .dpad-down  { bottom: 0; left: 49px; }
  .dpad-left  { top: 49px; left: 0; }
  .dpad-right { top: 49px; right: 0; }
  .touch-actions {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    right: max(16px, env(safe-area-inset-right));
    display: grid;
    grid-template-columns: repeat(2, 62px);
    gap: 8px;
    pointer-events: auto;
  }
  .act-btn {
    height: 50px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 18, 16, 0.58);
    color: rgba(255, 255, 255, 0.9);
    font: 700 0.78rem/1.1 system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .act-btn.fire-btn {
    background: rgba(179, 32, 26, 0.68);
    border-color: rgba(255, 110, 95, 0.45);
    height: 58px;
    font-size: 0.9rem;
  }
  .touch-top-bar {
    position: absolute;
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 156px);
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .touch-mini-group {
    display: flex;
    gap: 6px;
    pointer-events: auto;
  }
  .mini-btn {
    padding: 7px 11px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(20, 18, 16, 0.55);
    color: rgba(255, 255, 255, 0.88);
    font: 600 0.74rem/1 system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
    <div id="loader">
      <div class="loader-title">DOOMACH</div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="loader-sub" id="loadStatus">Initializing Mach 7.0 WebAssembly runtime...</div>
      <button class="retry-btn" id="retryBtn" type="button">Launch</button>
    </div>
  </div>

  <div id="hud">
    <div class="hud-group">
      <button class="pill accent" type="button" data-action="1" title="Start 4-player Nightmare Co-op with the trained neural-network bots">Co-op (Bots)</button>
      <button class="pill" type="button" data-action="2" title="Start 4-player Deathmatch with the league bots">Deathmatch</button>
      <button class="pill" type="button" id="joinBtn" title="Join a friend's room by 6-character code">Join Room</button>
      <button class="pill room-pill" type="button" id="roomBtn" title="Click to copy invite link for friends"></button>
      <button class="pill" type="button" data-action="3" title="Spectate the live 24/7 Co-op bot campaign">Watch Co-op</button>
      <button class="pill" type="button" data-action="4" title="Spectate the latest Deathmatch bot league match">Watch DM</button>
    </div>
    <div class="hud-group">
      <span class="pill" id="netBadge" title="Multiplayer lockstep connection"><span class="net-dot" id="netDot"></span><span id="netText">Online</span></span>
      <a class="pill" href="league.html" target="_blank" rel="noopener">Standings</a>
      <button class="pill" type="button" id="muteBtn">Sound: On</button>
      <button class="pill" type="button" id="fsBtn">Fullscreen</button>
    </div>
  </div>

  <div id="joinModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title">Join Room Code</div>
      <input class="modal-input" id="roomInput" type="text" maxlength="6" placeholder="KQ7M2T" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="pill" type="button" id="joinCancelBtn">Cancel</button>
        <button class="pill accent" type="button" id="joinGoBtn">Join Game</button>
      </div>
    </div>
  </div>

  <div id="touchControls">
    <div class="touch-top-bar">
      <div class="touch-mini-group">
        <button class="mini-btn" type="button" data-tapkey="27">Menu</button>
        <button class="mini-btn" type="button" data-tapkey="9">Map</button>
        <button class="mini-btn" type="button" data-tapkey="123">Spy</button>
      </div>
      <div class="touch-mini-group">
        <button class="mini-btn" type="button" data-tapkey="81">Blink</button>
        <button class="mini-btn" type="button" data-tapkey="88">Stim</button>
        <button class="mini-btn" type="button" id="touchWeaponBtn">Weapon</button>
        <button class="mini-btn" type="button" data-tapkey="13">Enter</button>
      </div>
    </div>
    <div class="touch-pad">
      <div class="dpad-btn dpad-up" data-holdkey="38">&uarr;</div>
      <div class="dpad-btn dpad-down" data-holdkey="40">&darr;</div>
      <div class="dpad-btn dpad-left" data-holdkey="65">&larr;</div>
      <div class="dpad-btn dpad-right" data-holdkey="68">&rarr;</div>
    </div>
    <div class="touch-actions">
      <div class="act-btn" data-holdkey="37">Turn &larr;</div>
      <div class="act-btn" data-holdkey="39">Turn &rarr;</div>
      <div class="act-btn" data-holdkey="32">Use</div>
      <div class="act-btn fire-btn" data-holdkey="17">FIRE</div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const imgData = ctx.createImageData(320, 200);
  const loader = document.getElementById('loader');
  const barFill = document.getElementById('barFill');
  const loadStatus = document.getElementById('loadStatus');
  const retryBtn = document.getElementById('retryBtn');
  const hud = document.getElementById('hud');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');
  const joinBtn = document.getElementById('joinBtn');
  const roomBtn = document.getElementById('roomBtn');
  const netDot = document.getElementById('netDot');
  const netText = document.getElementById('netText');
  const joinModal = document.getElementById('joinModal');
  const roomInput = document.getElementById('roomInput');
  const joinCancelBtn = document.getElementById('joinCancelBtn');
  const joinGoBtn = document.getElementById('joinGoBtn');
  const touchWeaponBtn = document.getElementById('touchWeaponBtn');

  let ex = null;
  let mem = null;
  let booting = false;
  let running = false;
  let muted = false;
  let audioCtx = null;
  let leagueBufPtr = 0;
  let leagueBufCap = 0;
  const leagueCache = { coop: null, dm: null };
  let currentRoomCode = '';
  let weaponCycle = 2;

  // Auto-hide HUD after 2.6 seconds of pointer inactivity during gameplay
  let hudTimer = 0;
  function showHud() {
    hud.classList.remove('idle');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => {
      if (running && !joinModal.classList.contains('open')) {
        hud.classList.add('idle');
      }
    }, 2600);
  }
  window.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas && e.movementY > -15) return;
    showHud();
  }, { passive: true });
  window.addEventListener('touchstart', () => {
    document.body.classList.add('touch-active');
    showHud();
    setupAudio();
  }, { passive: true });
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.body.classList.add('touch-active');
  }

  // WASI Preview 1 virtual filesystem persisted in localStorage for saves, profiles, and doom.cfg
  const STORAGE_PREFIX = 'doomach_vfs:';
  const vfs = new Map();
  const dirs = new Set(['', 'profiles']);
  const fds = new Map();
  let nextFd = 4;

  function normPath(p) {
    return p.replace(/^\/+|\/+$/g, '').replace(/^\.\//, '');
  }

  function loadPersistedVfs() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(STORAGE_PREFIX)) {
          const path = k.slice(STORAGE_PREFIX.length);
          const b64 = localStorage.getItem(k);
          if (b64 !== null) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
            vfs.set(path, arr);
            const slash = path.lastIndexOf('/');
            if (slash > 0) dirs.add(path.slice(0, slash));
          }
        }
      }
    } catch (_) {}
  }

  function persistFile(path) {
    try {
      const data = vfs.get(path);
      if (!data) {
        localStorage.removeItem(STORAGE_PREFIX + path);
        return;
      }
      let bin = '';
      for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
      localStorage.setItem(STORAGE_PREFIX + path, btoa(bin));
    } catch (_) {}
  }

  loadPersistedVfs();

  const textDec = new TextDecoder('utf-8');
  const textEnc = new TextEncoder();

  function readStr(ptr, len) {
    return textDec.decode(new Uint8Array(mem.buffer, ptr, len));
  }

  function readCString(ptr, maxLen = 16) {
    const u8 = new Uint8Array(mem.buffer, ptr, maxLen);
    let end = 0;
    while (end < maxLen && u8[end] !== 0) end++;
    return textDec.decode(u8.subarray(0, end));
  }

  const wasi = {
    args_sizes_get(cPtr, sPtr) {
      const v = new DataView(mem.buffer);
      v.setUint32(cPtr, 0, true);
      v.setUint32(sPtr, 0, true);
      return 0;
    },
    args_get() { return 0; },
    environ_sizes_get(cPtr, sPtr) {
      const v = new DataView(mem.buffer);
      v.setUint32(cPtr, 0, true);
      v.setUint32(sPtr, 0, true);
      return 0;
    },
    environ_get() { return 0; },
    fd_prestat_get(fd, out) {
      if (fd !== 3) return 8;
      const v = new DataView(mem.buffer);
      v.setUint32(out, 0, true);
      v.setUint32(out + 4, 1, true);
      return 0;
    },
    fd_prestat_dir_name(fd, namePtr) {
      if (fd !== 3) return 8;
      new Uint8Array(mem.buffer)[namePtr] = 47;
      return 0;
    },
    fd_fdstat_get(fd, out) {
      const v = new DataView(mem.buffer);
      let ft = 4, fl = 0;
      if (fd === 3) ft = 3;
      else if (fds.has(fd)) {
        const e = fds.get(fd);
        ft = e.dir ? 3 : 4;
        fl = e.append ? 1 : 0;
      } else if (fd > 2) return 8;
      v.setUint8(out, ft);
      v.setUint16(out + 2, fl, true);
      v.setBigUint64(out + 8, 0xffffffffffffffffn, true);
      v.setBigUint64(out + 16, 0xffffffffffffffffn, true);
      return 0;
    },
    fd_filestat_get(fd, out) {
      const v = new DataView(mem.buffer);
      for (let i = 0; i < 64; i += 8) v.setBigUint64(out + i, 0n, true);
      if (fd === 3) { v.setUint8(out + 16, 3); return 0; }
      const e = fds.get(fd);
      if (!e) return 8;
      v.setBigUint64(out, 1n, true);
      v.setBigUint64(out + 8, BigInt(fd), true);
      v.setUint8(out + 16, e.dir ? 3 : 4);
      v.setBigUint64(out + 24, 1n, true);
      const data = vfs.get(e.path);
      v.setBigUint64(out + 32, BigInt(data ? data.length : 0), true);
      return 0;
    },
    path_filestat_get(dirfd, flags, pathPtr, pathLen, out) {
      const p = normPath(readStr(pathPtr, pathLen));
      const v = new DataView(mem.buffer);
      for (let i = 0; i < 64; i += 8) v.setBigUint64(out + i, 0n, true);
      if (dirs.has(p)) {
        v.setBigUint64(out, 1n, true);
        v.setUint8(out + 16, 3);
        v.setBigUint64(out + 24, 1n, true);
        return 0;
      }
      if (vfs.has(p)) {
        v.setBigUint64(out, 1n, true);
        v.setUint8(out + 16, 4);
        v.setBigUint64(out + 24, 1n, true);
        v.setBigUint64(out + 32, BigInt(vfs.get(p).length), true);
        return 0;
      }
      return 44;
    },
    path_create_directory(dirfd, pathPtr, pathLen) {
      dirs.add(normPath(readStr(pathPtr, pathLen)));
      return 0;
    },
    path_open(dirfd, dirflags, pathPtr, pathLen, oflags, base, inh, fdflags, outPtr) {
      const p = normPath(readStr(pathPtr, pathLen));
      const wantDir = (oflags & 2) !== 0;
      const creat = (oflags & 1) !== 0;
      const trunc = (oflags & 8) !== 0;
      const append = (fdflags & 1) !== 0;
      if (wantDir || dirs.has(p)) {
        if (!dirs.has(p)) return 44;
        const fd = nextFd++;
        fds.set(fd, { path: p, dir: true, pos: 0, append: false, dirty: false });
        new DataView(mem.buffer).setInt32(outPtr, fd, true);
        return 0;
      }
      if (!vfs.has(p)) {
        if (!creat) return 44;
        vfs.set(p, new Uint8Array(0));
      } else if (trunc) {
        vfs.set(p, new Uint8Array(0));
      }
      const fd = nextFd++;
      fds.set(fd, { path: p, dir: false, pos: append ? vfs.get(p).length : 0, append, dirty: creat || trunc });
      new DataView(mem.buffer).setInt32(outPtr, fd, true);
      return 0;
    },
    fd_read(fd, iovsPtr, iovsLen, donePtr) {
      const e = fds.get(fd);
      if (!e || e.dir) return 8;
      const data = vfs.get(e.path) || new Uint8Array(0);
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let total = 0;
      for (let i = 0; i < iovsLen; i++) {
        const ptr = v.getUint32(iovsPtr + i * 8, true);
        const len = v.getUint32(iovsPtr + i * 8 + 4, true);
        const avail = Math.min(len, Math.max(0, data.length - e.pos));
        if (avail > 0) {
          u8.set(data.subarray(e.pos, e.pos + avail), ptr);
          e.pos += avail;
          total += avail;
        }
      }
      v.setUint32(donePtr, total, true);
      return 0;
    },
    fd_write(fd, iovsPtr, iovsLen, donePtr) {
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let total = 0;
      if (fd === 1 || fd === 2) {
        for (let i = 0; i < iovsLen; i++) total += v.getUint32(iovsPtr + i * 8 + 4, true);
        v.setUint32(donePtr, total, true);
        return 0;
      }
      const e = fds.get(fd);
      if (!e || e.dir) return 8;
      let cur = vfs.get(e.path) || new Uint8Array(0);
      for (let i = 0; i < iovsLen; i++) {
        const ptr = v.getUint32(iovsPtr + i * 8, true);
        const len = v.getUint32(iovsPtr + i * 8 + 4, true);
        const chunk = u8.slice(ptr, ptr + len);
        const at = e.append ? cur.length : e.pos;
        const next = new Uint8Array(Math.max(cur.length, at + len));
        next.set(cur);
        next.set(chunk, at);
        cur = next;
        e.pos = at + len;
        total += len;
      }
      vfs.set(e.path, cur);
      e.dirty = true;
      v.setUint32(donePtr, total, true);
      return 0;
    },
    fd_readdir(fd, bufPtr, bufLen, cookie, usedPtr) {
      const e = fds.get(fd);
      if (!e || !e.dir) return 8;
      const prefix = e.path ? e.path + '/' : '';
      const entries = [];
      for (const k of vfs.keys()) {
        if (k.startsWith(prefix)) {
          const rest = k.slice(prefix.length);
          if (rest && !rest.includes('/')) entries.push({ name: rest, kind: 4 });
        }
      }
      const v = new DataView(mem.buffer);
      const u8 = new Uint8Array(mem.buffer);
      let off = 0;
      for (let i = Number(cookie); i < entries.length; i++) {
        const nb = textEnc.encode(entries[i].name);
        if (off + 24 + nb.length > bufLen) break;
        v.setBigUint64(bufPtr + off, BigInt(i + 1), true);
        v.setBigUint64(bufPtr + off + 8, BigInt(i + 100), true);
        v.setUint32(bufPtr + off + 16, nb.length, true);
        v.setUint8(bufPtr + off + 20, entries[i].kind);
        u8.set(nb, bufPtr + off + 24);
        off += 24 + nb.length;
      }
      v.setUint32(usedPtr, off, true);
      return 0;
    },
    fd_sync(fd) {
      const e = fds.get(fd);
      if (e && !e.dir && e.dirty) {
        persistFile(e.path);
        e.dirty = false;
      }
      return 0;
    },
    fd_close(fd) {
      const e = fds.get(fd);
      if (e && !e.dir && e.dirty) persistFile(e.path);
      fds.delete(fd);
      return 0;
    },
    path_rename(ofd, opPtr, opLen, nfd, npPtr, npLen) {
      const op = normPath(readStr(opPtr, opLen));
      const np = normPath(readStr(npPtr, npLen));
      if (!vfs.has(op)) return 44;
      vfs.set(np, vfs.get(op));
      vfs.delete(op);
      persistFile(op);
      persistFile(np);
      return 0;
    },
    path_unlink_file(dirfd, pPtr, pLen) {
      const p = normPath(readStr(pPtr, pLen));
      if (!vfs.has(p)) return 44;
      vfs.delete(p);
      persistFile(p);
      return 0;
    },
    path_remove_directory(dirfd, pPtr, pLen) {
      dirs.delete(normPath(readStr(pPtr, pLen)));
      return 0;
    },
    random_get(ptr, len) {
      crypto.getRandomValues(new Uint8Array(mem.buffer, ptr, len));
      return 0;
    },
    proc_exit() {}
  };

  // Multiplayer transport: persistent binary WebSocket with HTTP /net/** fallback
  const clientIdBytes = new Uint8Array(4);
  crypto.getRandomValues(clientIdBytes);
  clientIdBytes[0] |= 1;
  const clientIdHex = Array.from(clientIdBytes, (b) => b.toString(16).padStart(2, '0')).join('');

  let ws = null;
  let wsConnected = false;
  let wsConnecting = false;
  let wsLastTry = 0;
  let httpInFlight = false;
  let httpLastPoll = 0;
  let httpPendingHex = [];
  let netActiveUntil = 0;

  function toHex(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i++) {
      const h = u8[i].toString(16);
      s += h.length === 1 ? '0' + h : h;
    }
    return s;
  }

  function pushIncomingBytes(u8) {
    if (!ex || !mem || u8.length < 16 || u8.length > 1500) return;
    const tPtr = ex.web_transfer_ptr();
    new Uint8Array(mem.buffer, tPtr, u8.length).set(u8);
    ex.web_net_push(tPtr, u8.length);
  }

  function connectWebSocket() {
    if (wsConnected || wsConnecting) return;
    const now = performance.now();
    if (now - wsLastTry < 4000) return;
    wsLastTry = now;
    wsConnecting = true;
    try {
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const wsUrl = isLocal
        ? 'ws://' + location.hostname + ':5030/ws'
        : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':5029/ws';
      const sock = new WebSocket(wsUrl);
      sock.binaryType = 'arraybuffer';
      sock.onopen = () => {
        ws = sock;
        wsConnected = true;
        wsConnecting = false;
        netDot.className = 'net-dot live';
        netText.textContent = 'WS Live';
      };
      sock.onmessage = (ev) => {
        if (ev.data instanceof ArrayBuffer) {
          pushIncomingBytes(new Uint8Array(ev.data));
        }
      };
      sock.onclose = () => {
        if (ws === sock) ws = null;
        wsConnected = false;
        wsConnecting = false;
        netDot.className = 'net-dot http';
        netText.textContent = 'HTTPS';
      };
      sock.onerror = () => {
        wsConnecting = false;
      };
    } catch (_) {
      wsConnecting = false;
    }
  }

  async function flushHttpNet() {
    if (httpInFlight || !ex) return;
    const now = performance.now();
    const hasOut = httpPendingHex.length > 0;
    if (!hasOut && (now > netActiveUntil || now - httpLastPoll < 42)) return;
    httpInFlight = true;
    httpLastPoll = now;
    const batch = hasOut ? httpPendingHex.splice(0, 8).join('.') : '0';
    try {
      const res = await fetch('/net/' + clientIdHex + '/' + batch, { cache: 'no-store' });
      if (res.ok) {
        netDot.className = 'net-dot http';
        netText.textContent = 'HTTPS';
        const buf = new Uint8Array(await res.arrayBuffer());
        let off = 0;
        while (off + 2 <= buf.length) {
          const plen = buf[off] | (buf[off + 1] << 8);
          off += 2;
          if (plen > 0 && off + plen <= buf.length) {
            pushIncomingBytes(buf.subarray(off, off + plen));
          }
          off += plen;
        }
      }
    } catch (_) {
    } finally {
      httpInFlight = false;
    }
  }

  function pumpNet() {
    if (!ex || !mem) return;
    const tPtr = ex.web_transfer_ptr();
    let sentAny = false;
    while (true) {
      const len = ex.web_net_pop(tPtr, 1400);
      if (len <= 0) break;
      sentAny = true;
      const pkt = new Uint8Array(mem.buffer, tPtr, len).slice();
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(pkt);
      } else {
        connectWebSocket();
        httpPendingHex.push(toHex(pkt));
        if (httpPendingHex.length > 48) httpPendingHex.shift();
      }
    }
    if (sentAny) {
      netActiveUntil = performance.now() + 8000;
    }
    if (!wsConnected) {
      flushHttpNet();
    }

    // Check if the player is hosting/waiting in a room and show the room invite pill
    const code = readCString(ex.web_room_code_ptr(), 7);
    if (code !== currentRoomCode) {
      currentRoomCode = code;
      if (code.length === 6) {
        roomBtn.style.display = 'inline-block';
        roomBtn.textContent = 'Room ' + code + ' (Copy Link)';
        showHud();
      } else {
        roomBtn.style.display = 'none';
      }
    }
  }

  function mapKey(e) {
    switch (e.code) {
      case 'ArrowUp': return 0x26;
      case 'ArrowDown': return 0x28;
      case 'ArrowLeft': return 0x25;
      case 'ArrowRight': return 0x27;
      case 'Enter':
      case 'NumpadEnter': return 0x0d;
      case 'Escape': return 0x1b;
      case 'Backspace': return 0x08;
      case 'Tab': return 0x09;
      case 'Space': return 0x20;
      case 'ShiftLeft':
      case 'ShiftRight': return 0x10;
      case 'ControlLeft':
      case 'ControlRight': return 0x11;
      case 'F12': return 0x7b;
      case 'Minus': return e.shiftKey ? 95 : 45;
      case 'Equal': return e.shiftKey ? 43 : 61;
    }
    if (e.code && e.code.startsWith('Key') && e.code.length === 4) {
      return e.code.charCodeAt(3);
    }
    if (e.code && e.code.startsWith('Digit') && e.code.length === 6) {
      return e.code.charCodeAt(5);
    }
    if (e.key && e.key.length === 1) {
      const c = e.key.toUpperCase().charCodeAt(0);
      if (c >= 32 && c < 127) return c;
    }
    return 0;
  }

  function setupAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      const srcRate = 11025;
      const dstRate = audioCtx.sampleRate;
      const proc = audioCtx.createScriptProcessor(2048, 0, 2);
      let frac = 0;
      let lastL = 0, lastR = 0;
      proc.onaudioprocess = (ev) => {
        const outL = ev.outputBuffer.getChannelData(0);
        const outR = ev.outputBuffer.getChannelData(1);
        const n = outL.length;
        if (!running || muted || !ex) {
          outL.fill(0);
          outR.fill(0);
          return;
        }
        const step = srcRate / dstRate;
        const needed = Math.min(4096, Math.ceil((n * step) + frac) + 2);
        const pcmPtr = ex.web_audio(needed);
        const pcm = new Int16Array(mem.buffer, pcmPtr, needed * 2);
        let idx = 0;
        for (let i = 0; i < n; i++) {
          frac += step;
          while (frac >= 1 && idx < needed) {
            lastL = pcm[idx * 2] / 32768;
            lastR = pcm[idx * 2 + 1] / 32768;
            idx++;
            frac -= 1;
          }
          outL[i] = lastL;
          outR[i] = lastR;
        }
      };
      proc.connect(audioCtx.destination);
    } catch (_) {}
  }

  async function fetchBytes(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(url + ' (' + res.status + ')');
    return new Uint8Array(await res.arrayBuffer());
  }

  async function handleAction(act) {
    if (!ex) return;
    const tPtr = ex.web_transfer_ptr();
    if (act === 2) {
      try {
        const bytes = await fetchBytes('league/watch.bin?t=' + Date.now());
        new Uint8Array(mem.buffer, tPtr, bytes.length).set(bytes);
        ex.web_watch_dm_load(bytes.length);
      } catch (_) {
        ex.web_watch_dm_load(0);
      }
    } else if (act === 1) {
      try {
        const nowBytes = await fetchBytes('league/coopnow.bin?t=' + Date.now());
        let tickBytes = new Uint8Array(0);
        try { tickBytes = await fetchBytes('league/coopnow.tic?t=' + Date.now()); } catch (_) {}
        const u8 = new Uint8Array(mem.buffer);
        u8.set(nowBytes.subarray(0, 6492), tPtr);
        if (tickBytes.length > 0) u8.set(tickBytes.subarray(0, 16), tPtr + 6492);
        ex.web_watch_coop_load(nowBytes.length, tickBytes.length);
      } catch (_) {
        ex.web_watch_coop_load(0, 0);
      }
    } else if (act === 3 || act === 4) {
      const isCoop = act === 3;
      const key = isCoop ? 'coop' : 'dm';
      const url = isCoop ? 'league/coop.bin' : 'league/league.bin';
      if (!leagueCache[key]) {
        try {
          leagueCache[key] = await fetchBytes(url + '?t=' + Date.now());
        } catch (_) {
          leagueCache[key] = null;
        }
      }
      const data = leagueCache[key];
      const seed = (Date.now() & 0x7fffffff) | 1;
      if (data && data.length > 0) {
        if (leagueBufCap < data.length) {
          leagueBufPtr = ex.web_alloc(data.length);
          leagueBufCap = data.length;
        }
        new Uint8Array(mem.buffer, leagueBufPtr, data.length).set(data);
        ex.web_start_bot_game(leagueBufPtr, data.length, seed);
      } else {
        ex.web_start_bot_game(0, 0, seed);
      }
    }
  }

  function joinRoomByCode(rawCode) {
    if (!ex || !mem) return false;
    const clean = (rawCode || '').trim().toUpperCase();
    if (clean.length !== 6) return false;
    const tPtr = ex.web_transfer_ptr();
    const u8 = new Uint8Array(mem.buffer, tPtr, 8);
    for (let i = 0; i < 6; i++) u8[i] = clean.charCodeAt(i);
    u8[6] = 0;
    return ex.web_join_room(tPtr) === 1;
  }

  async function boot(initialAction = 0) {
    if (running) {
      canvas.focus();
      if (initialAction > 0) ex.web_quick_action(initialAction);
      return;
    }
    if (booting) return;
    booting = true;
    retryBtn.style.display = 'none';
    barFill.style.width = '30%';
    loadStatus.textContent = 'Loading doom.wasm and DOOM1.WAD...';
    connectWebSocket();

    try {
      const [wasmRes, wadRes] = await Promise.all([
        fetch('doom.wasm'),
        fetch('DOOM1.WAD')
      ]);
      if (!wasmRes.ok) throw new Error('Could not load doom.wasm');
      if (!wadRes.ok) throw new Error('Could not load DOOM1.WAD');
      barFill.style.width = '65%';
      const [wasmBuf, wadBuf] = await Promise.all([
        wasmRes.arrayBuffer(),
        wadRes.arrayBuffer()
      ]);
      barFill.style.width = '85%';
      loadStatus.textContent = 'Starting deterministic simulation...';
      const wadBytes = new Uint8Array(wadBuf);
      const { instance } = await WebAssembly.instantiate(wasmBuf, {
        wasi_snapshot_preview1: wasi
      });
      ex = instance.exports;
      mem = ex.memory;

      const wadPtr = ex.web_alloc(wadBytes.length);
      new Uint8Array(mem.buffer, wadPtr, wadBytes.length).set(wadBytes);
      const rc = ex.web_init(wadPtr, wadBytes.length);
      if (rc !== 0) throw new Error('web_init returned ' + rc);

      barFill.style.width = '100%';
      loader.classList.add('hidden');
      canvas.focus();
      running = true;
      showHud();

      // Check for ?room=CODE or #CODE invite link in the URL
      const params = new URLSearchParams(location.search);
      const urlRoom = params.get('room') || (location.hash ? location.hash.slice(1) : '');
      if (urlRoom && urlRoom.trim().length === 6) {
        joinRoomByCode(urlRoom);
      } else if (initialAction > 0) {
        ex.web_quick_action(initialAction);
      }

      const TIC_MS = 1000 / 35;
      let nextTic = performance.now();

      function frame(now) {
        let steps = 0;
        while (now >= nextTic && steps < 4) {
          ex.web_tic();
          pumpNet();
          const act = ex.web_poll_action();
          if (act !== 0) handleAction(act);
          nextTic += TIC_MS;
          steps++;
        }
        if (now >= nextTic) nextTic = now;
        if (steps > 0) {
          const rgbaPtr = ex.web_draw();
          imgData.data.set(new Uint8ClampedArray(mem.buffer, rgbaPtr, 320 * 200 * 4));
          ctx.putImageData(imgData, 0, 0);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    } catch (err) {
      booting = false;
      retryBtn.style.display = 'inline-block';
      loadStatus.textContent = String(err.message || err);
    }
  }

  retryBtn.addEventListener('click', () => {
    setupAudio();
    boot(0);
  });

  document.querySelectorAll('[data-action]').forEach((btn) => {
    btn.addEventListener('click', () => {
      setupAudio();
      const act = Number(btn.getAttribute('data-action')) || 0;
      boot(act);
    });
  });

  joinBtn.addEventListener('click', () => {
    setupAudio();
    if (document.pointerLockElement === canvas) document.exitPointerLock();
    joinModal.classList.add('open');
    roomInput.value = '';
    setTimeout(() => roomInput.focus(), 20);
  });

  joinCancelBtn.addEventListener('click', () => {
    joinModal.classList.remove('open');
    canvas.focus();
  });

  function submitJoinModal() {
    const code = roomInput.value.trim().toUpperCase();
    if (code.length === 6) {
      joinModal.classList.remove('open');
      joinRoomByCode(code);
      canvas.focus();
    }
  }

  joinGoBtn.addEventListener('click', submitJoinModal);
  roomInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      submitJoinModal();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      joinModal.classList.remove('open');
      canvas.focus();
    }
  });

  roomBtn.addEventListener('click', async () => {
    if (!currentRoomCode) return;
    const url = location.origin + location.pathname + '?room=' + currentRoomCode;
    try {
      await navigator.clipboard.writeText(url);
      roomBtn.textContent = 'Copied ' + currentRoomCode + '!';
      setTimeout(() => {
        if (currentRoomCode) roomBtn.textContent = 'Room ' + currentRoomCode + ' (Copy Link)';
      }, 1800);
    } catch (_) {
      prompt('Share this link or room code with your friends:', url);
    }
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? 'Sound: Muted' : 'Sound: On';
    if (!muted) setupAudio();
    canvas.focus();
  });

  fsBtn.addEventListener('click', () => {
    setupAudio();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
    canvas.focus();
  });

  window.addEventListener('keydown', (e) => {
    if (joinModal.classList.contains('open')) return;
    setupAudio();
    if (!running || !ex) return;
    const k = mapKey(e);
    if (k !== 0) {
      e.preventDefault();
      if (k === 0x1b && document.pointerLockElement === canvas) {
        document.exitPointerLock();
      }
      ex.web_key_down(k, e.repeat ? 1 : 0);
    }
  });

  window.addEventListener('keyup', (e) => {
    if (joinModal.classList.contains('open')) return;
    if (!running || !ex) return;
    const k = mapKey(e);
    if (k !== 0) {
      e.preventDefault();
      ex.web_key_up(k);
    }
  });

  window.addEventListener('blur', () => {
    if (ex) ex.web_release_all();
  });

  canvas.addEventListener('mousedown', (e) => {
    canvas.focus();
    setupAudio();
    if (!running || !ex) return;
    if (document.pointerLockElement !== canvas && ex.web_want_pointer_lock() === 1) {
      canvas.requestPointerLock?.();
      return;
    }
    if (document.pointerLockElement === canvas) {
      e.preventDefault();
      ex.web_mouse_button(e.button, 1);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (!running || !ex) return;
    ex.web_mouse_button(e.button, 0);
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('mousemove', (e) => {
    if (!running || !ex) return;
    if (document.pointerLockElement === canvas) {
      ex.web_mouse_move(e.movementX | 0);
    }
  });

  // Touch controls: hold buttons, tap buttons, and drag-to-turn on the canvas
  document.querySelectorAll('[data-holdkey]').forEach((el) => {
    const code = Number(el.getAttribute('data-holdkey'));
    const press = (e) => {
      e.preventDefault();
      setupAudio();
      el.classList.add('active');
      if (ex) ex.web_key_down(code, 0);
    };
    const release = (e) => {
      e.preventDefault();
      el.classList.remove('active');
      if (ex) ex.web_key_up(code);
    };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
  });

  document.querySelectorAll('[data-tapkey]').forEach((el) => {
    const code = Number(el.getAttribute('data-tapkey'));
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setupAudio();
      if (ex) {
        ex.web_key_down(code, 0);
        setTimeout(() => ex.web_key_up(code), 60);
      }
    }, { passive: false });
  });

  touchWeaponBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    setupAudio();
    if (!ex) return;
    const code = 48 + weaponCycle;
    weaponCycle = (weaponCycle % 7) + 1;
    ex.web_key_down(code, 0);
    setTimeout(() => ex.web_key_up(code), 60);
  }, { passive: false });

  let lookTouchId = null;
  let lookLastX = 0;
  canvas.addEventListener('touchstart', (e) => {
    setupAudio();
    if (lookTouchId === null && e.changedTouches.length > 0) {
      const t = e.changedTouches[0];
      lookTouchId = t.identifier;
      lookLastX = t.clientX;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (!ex || lookTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        const dx = Math.round((t.clientX - lookLastX) * 2.2);
        lookLastX = t.clientX;
        if (dx !== 0) ex.web_mouse_move(dx);
        break;
      }
    }
  }, { passive: true });

  const endLookTouch = (e) => {
    if (lookTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === lookTouchId) {
        lookTouchId = null;
        break;
      }
    }
  };
  canvas.addEventListener('touchend', endLookTouch, { passive: true });
  canvas.addEventListener('touchcancel', endLookTouch, { passive: true });

  window.addEventListener('pagehide', () => {
    if (ex) ex.web_flush_profile();
  });

  // Auto-boot immediately into the 4:3 browser runtime
  boot(0);
})();
</script>
</body>
</html>
