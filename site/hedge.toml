# hedge serving the pages beside the relay: the site, and the bot league's
# standings from the persistent disk the arena writes them to. Fly's proxy ends TLS and
# passes plain HTTP to port 8080.

[server]
name = "doom-site"

[[listener]]
name = "public"
address = "0.0.0.0:8080"
protocols = ["http/1.1"]

[host.site]
listener = "public"
names = ["mach-doom-relay.fly.dev", "localhost"]

[service.files]
kind = "static"
root = "/srv/site"
index = "index.html"

[service.league]
kind = "static"
root = "/data"

[[route]]
name = "league"
host = "site"
path = "/league/**"
service = "league"

[[route]]
name = "everything"
host = "site"
path = "/**"
service = "files"
