[project]
id = "doom"
version = "0.6.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

# the home farm's trainers: the Raspberry Pis and the Mac mini
[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.wasi-wasm32]
arch = "wasm32"
sys  = "wasi"
env  = "preview1"
abi  = "basic"
ext  = ["nontrapping-fptoint"]

[artifact.doom]
kind = "bin"
entry = "root.mach"
out = "{project.work}/bin/doom{artifact.suffix}"
targets = ["windows-x86_64"]
default = true
link = ["kernel32", "user32", "gdi32", "winmm", "ws2_32", "urlmon"]
need = []

[link.urlmon]
source = "system"
include = "referenced"
name = "urlmon.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[link.kernel32]
source = "system"
include = "referenced"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[link.user32]
source = "system"
include = "referenced"
name = "user32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[link.gdi32]
source = "system"
include = "referenced"
name = "gdi32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[artifact.relay]
kind = "bin"
entry = "relay.mach"
out = "{project.work}/bin/relay{artifact.suffix}"
targets = ["windows-x86_64", "linux-x86_64"]
link = ["kernel32", "ws2_32"]
need = []

[link.ws2_32]
source = "system"
include = "referenced"
name = "ws2_32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[link.winmm]
source = "system"
include = "referenced"
name = "winmm.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v10.1.1"

[artifact.arena]
kind = "bin"
entry = "arena.mach"
out = "{project.work}/bin/arena{artifact.suffix}"
targets = ["windows-x86_64", "linux-x86_64", "linux-aarch64", "darwin-x86_64"]
link = ["kernel32", "ws2_32"]
need = []

[artifact.web]
kind = "module"
entry = "web.mach"
out = "{project.work}/bin/doom{artifact.suffix}"
targets = ["wasi-wasm32"]
link = []
need = []
