[project]
id = "doom"
version = "0.1.0"
mach = "^6.9"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[artifact.doom]
kind = "bin"
entry = "root.mach"
out = "bin/doom{artifact.suffix}"
targets = ["windows-x86_64"]
default = true
link = ["kernel32", "user32", "gdi32", "winmm", "ws2_32", "urlmon"]
need = []

[link.urlmon]
source = "system"
name = "urlmon.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.user32]
source = "system"
name = "user32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.gdi32]
source = "system"
name = "gdi32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.relay]
kind = "bin"
entry = "relay.mach"
out = "bin/relay{artifact.suffix}"
targets = ["windows-x86_64", "linux-x86_64"]
link = ["kernel32", "ws2_32"]
need = []

[link.ws2_32]
source = "system"
name = "ws2_32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.winmm]
source = "system"
name = "winmm.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v9.4.1"

[artifact.arena]
kind = "bin"
entry = "arena.mach"
out = "bin/arena{artifact.suffix}"
targets = ["windows-x86_64", "linux-x86_64"]
link = ["kernel32", "ws2_32"]
need = []
